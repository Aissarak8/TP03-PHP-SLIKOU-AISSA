<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Saisie des notes</h1>
        <form action="traitement.php" method="post">
            <label>Nom :</label>
            <input type="text" name="nom" required>

            <label>Note d'informatique :</label>
            <input type="number" name="note_info" min="0" max="20" step="0.01" required>

            <label>Note de mathématiques :</label>
            <input type="number" name="note_math" min="0" max="20" step="0.01" required>

            <button type="submit">Enregistrer</button>
        </form>
        <p><a href="liste.php">Afficher la liste</a></p>
    </main>
</body>
</html>
